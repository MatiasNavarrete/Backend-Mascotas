spring.application.name=ms-mascotas
server.port=8081

# CONFIGURACIÓN H2 (PARA PRUEBAS INICIALES)
spring.datasource.url=jdbc:h2:file:./data/mascotasdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Habilitar consola H2 (Acceso en http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# CONFIGURACIÓN POSTGRESQL (COMENTADA POR AHORA)
# spring.datasource.url=jdbc:postgresql://localhost:5432/sanos_y_salvos_db
# spring.datasource.username=tu_usuario
# spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Configuración JPA General
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.serialization.write-dates-as-timestamps=false